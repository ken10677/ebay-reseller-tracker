name: Weekly eBay Sync

on:
  # Run weekly on Sundays at 6 AM UTC (1 AM EST / 2 AM EDT)
  schedule:
    - cron: '0 6 * * 0'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug logging'
        required: false
        default: 'false'
        type: boolean
      clear_inventory:
        description: 'Clear inventory sheet before sync (removes duplicates)'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        env:
          # eBay OAuth - Auto-refresh (recommended)
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          # eBay OAuth - Manual token (fallback if refresh not configured)
          EBAY_USER_TOKEN: ${{ secrets.EBAY_USER_TOKEN }}
          # eBay Trading API (optional)
          EBAY_TRADING_TOKEN: ${{ secrets.EBAY_TRADING_TOKEN }}
          # Google Sheets
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          # Email notifications (optional)
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          # Settings
          TIMEZONE: 'America/New_York'
          SYNC_START_DATE: '2025-11-01'
          LOG_LEVEL: ${{ github.event.inputs.debug == 'true' && 'DEBUG' || 'INFO' }}
        run: |
          python -m src.main ${{ github.event.inputs.clear_inventory == 'true' && '--clear-inventory' || '' }}

      - name: Check for token expiry warning
        if: failure()
        run: |
          echo "::warning::Sync failed! Check if eBay token needs refresh."
          echo "See: https://developer.ebay.com/api-docs/static/oauth-tokens.html"

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: sync
    if: failure()

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Weekly Sync Failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `The weekly eBay sync workflow failed.

            **Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            Common causes:
            - eBay OAuth token expired (refresh at https://developer.ebay.com)
            - Google Sheets API quota exceeded
            - Network/API temporary outage

            Please check the workflow logs for details.`;

            // Check if issue already exists today
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-failure',
              per_page: 5
            });

            const today = new Date().toISOString().split('T')[0];
            const existingIssue = issues.data.find(i => i.title.includes(today));

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['sync-failure', 'automated']
              });
            }
